<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aflowgent — Dashboard</title>
<!--
===============================================================================
  AFLOWGENT STUDIO CRM — hosted edition  (v2 · 2026-08-04)
===============================================================================
  Lives at aflowgent.com/dashboard. Data is in Supabase (real Postgres), NOT in the
  browser — so it survives everything, syncs across devices, and can't vanish.

  SETUP: fill in SUPABASE_URL and SUPABASE_KEY below, run schema.sql in the
  Supabase SQL editor, then follow SETUP.md. Until the two values are filled in
  the app says so instead of silently failing.

  ACCESS: only sales@aflowgent.com and info@aflowgent.com. Signing in happens on
  the homepage (aflowgent.com → "Login"), which emails a one-time code. Reaching
  this page without a valid session bounces you straight back there. The real
  lock is Row Level Security in the database — the redirect is just the front
  door. Anyone else who lands here gets nothing, even with the public key.

  The SUPABASE_KEY below is a PUBLISHABLE key. It is meant to be in public
  client code and is safe to commit — it grants nothing on its own, because
  every table's RLS policy checks your signed-in email first.
===============================================================================
-->
<style>
:root{
  --bg:#14120F; --surface:#1C1916; --surface-2:#232019; --surface-3:#2B2721;
  --border:#332D26; --border-soft:#262119;
  --text:#F2EBDD; --text-dim:#A2988A; --text-faint:#6E655A;
  --gold:#C6A45C; --gold-soft:#8A7440;
  --violet:#8E7CC3; --amber:#D9A441; --mint:#7BC49A; --danger:#D97764;
  --radius:10px; --radius-sm:7px; --sidebar-w:230px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --shadow:0 18px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--border-soft)}
.brand h1{font-family:var(--font-display);font-size:20px;font-weight:600}
.brand .dot{color:var(--gold)}
.brand p{font-size:10px;color:var(--text-faint);margin-top:3px;letter-spacing:.22em}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);padding:12px 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--text-dim);font-size:13.5px;margin-bottom:1px;transition:background .12s,color .12s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--surface-3);color:var(--text)}
.nav a.active .ico{color:var(--gold)}
.ico{width:16px;text-align:center;font-size:13px;color:var(--text-faint);flex:0 0 16px}
.nav a .count{margin-left:auto;font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--border-soft);font-size:10.5px;color:var(--text-faint);line-height:1.6}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;flex:0 0 58px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px;padding:0 24px;background:var(--bg);position:sticky;top:0;z-index:20}
.search{position:relative;flex:1;max-width:420px}
.search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px 8px 32px;font-size:13px;outline:none}
.search input:focus{border-color:var(--gold-soft)}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:12px}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);max-height:340px;overflow-y:auto;z-index:60}
.search-results .sr-group{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);padding:9px 12px 4px}
.search-results .sr{display:flex;align-items:center;gap:9px;padding:7px 12px;cursor:pointer;font-size:13px}
.search-results .sr:hover{background:var(--surface-3)}
.search-results .sr small{color:var(--text-faint);margin-left:auto;font-size:11px}
.search-empty{padding:14px 12px;color:var(--text-faint);font-size:12.5px}

.content{padding:26px 24px 60px;flex:1;max-width:1360px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-family:var(--font-display);font-size:25px;font-weight:600}
.page-head .sub{color:var(--text-dim);font-size:13px;margin-top:3px}
.page-head .spacer{flex:1}

.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:7px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-3);border-color:var(--gold-soft)}
.btn-primary{background:var(--gold);border-color:var(--gold);color:#191510;font-weight:600}
.btn-primary:hover{background:#D6B36B;border-color:#D6B36B}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger:hover{border-color:var(--danger);color:var(--danger)}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head h3{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim)}
.card-head .spacer{flex:1}
.card-sub{font-size:12px;color:var(--text-faint);margin:-8px 0 12px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.tile .v{font-family:var(--font-display);font-size:27px;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .m{font-size:12px;color:var(--text-dim);margin-top:3px}
.tile.accent-gold .v{color:var(--gold)}
.tile.accent-violet .v{color:var(--violet)}
.tile.accent-amber .v{color:var(--amber)}
.tile.accent-mint .v{color:var(--mint)}
.tile.accent-danger .v{color:var(--danger)}

.stagebar{display:flex;gap:3px;height:9px;border-radius:5px;overflow:hidden;margin-bottom:12px}
.stagebar span{display:block;transition:width .3s}
.stagekey{display:flex;flex-wrap:wrap;gap:8px 16px}
.stagekey div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim)}
.stagekey i{width:9px;height:9px;border-radius:2px;display:block}
.stagekey b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}

.table-wrap{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);padding:11px 16px;border-bottom:1px solid var(--border-soft);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text-dim)}
th .arrow{opacity:.6;font-size:9px;margin-left:3px}
td{padding:12px 16px;border-bottom:1px solid var(--border-soft);font-size:13.5px;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td .strong{font-weight:600}
td .dim{color:var(--text-dim);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;border-top:1px solid var(--border);background:var(--surface-2)}

.filters{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;font-size:13px;outline:none;min-width:130px}
.filters input:focus,.filters select:focus{border-color:var(--gold-soft)}
.filters .spacer{flex:1}
.result-count{font-size:12px;color:var(--text-faint)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.badge-violet{color:var(--violet);background:rgba(142,124,195,.13);border-color:rgba(142,124,195,.28)}
.badge-amber{color:var(--amber);background:rgba(217,164,65,.13);border-color:rgba(217,164,65,.28)}
.badge-mint{color:var(--mint);background:rgba(123,196,154,.13);border-color:rgba(123,196,154,.28)}
.badge-gold{color:var(--gold);background:rgba(198,164,92,.13);border-color:rgba(198,164,92,.28)}
.badge-dim{color:var(--text-dim);background:var(--surface-3);border-color:var(--border)}
.badge-danger{color:var(--danger);background:rgba(217,119,100,.13);border-color:rgba(217,119,100,.3)}
.chip{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--surface-3);border:1px solid var(--border);font-size:11.5px;color:var(--text-dim);margin:0 4px 4px 0}
.money-in{color:var(--mint)}
.money-out{color:var(--danger)}

.detail-head{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
.detail-head .crumb{font-size:12px;color:var(--text-faint);margin-bottom:9px}
.detail-head .crumb a:hover{color:var(--gold)}
.detail-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.detail-title h2{font-family:var(--font-display);font-size:23px;font-weight:600}
.detail-title .spacer{flex:1}
.detail-meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-soft)}
.detail-meta div{font-size:12.5px}
.detail-meta .k{color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
@media(max-width:960px){.cols{grid-template-columns:1fr}.sidebar{display:none}}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px 22px}
.fieldgrid .f .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-bottom:4px}
.fieldgrid .f .v{font-size:13.5px;word-break:break-word;white-space:pre-wrap}
.fieldgrid .f .v.empty{color:var(--text-faint);font-style:italic}

.rel-list{display:flex;flex-direction:column}
.rel{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border-soft);cursor:pointer}
.rel:last-child{border-bottom:none}
.rel:hover .rel-name{color:var(--gold)}
.rel .avatar{width:29px;height:29px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim);flex:0 0 29px;font-weight:600}
.rel-name{font-size:13.5px}
.rel-sub{font-size:11.5px;color:var(--text-faint)}
.rel .spacer{flex:1}

.timeline{position:relative;padding-left:20px}
.timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:var(--border)}
.tl{position:relative;padding-bottom:15px}
.tl:last-child{padding-bottom:0}
.tl:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface-3);border:2px solid var(--bg)}
.tl.t-violet:before{background:var(--violet)}
.tl.t-amber:before{background:var(--amber)}
.tl.t-mint:before{background:var(--mint)}
.tl.t-gold:before{background:var(--gold)}
.tl .th{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.tl .tt{font-size:13.5px}
.tl .td{font-size:11.5px;color:var(--text-faint);margin-left:auto;white-space:nowrap}
.tl .tb{font-size:12.5px;color:var(--text-dim);margin-top:3px}

.att{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border-soft);cursor:pointer}
.att:last-child{border-bottom:none}
.att:hover .att-t{color:var(--gold)}
.att .att-t{font-size:13.5px}
.att .att-r{font-size:12px;color:var(--text-dim);margin-top:2px}
.att .spacer{flex:1}
.empty-line{color:var(--text-faint);font-size:12.5px;font-style:italic}

.empty{text-align:center;padding:44px 20px;color:var(--text-faint)}
.empty .e-ico{font-size:26px;color:var(--surface-3);margin-bottom:10px}
.empty h4{font-size:14px;color:var(--text-dim);margin-bottom:5px;font-weight:600}
.empty p{font-size:12.5px;max-width:360px;margin:0 auto 14px}

.overlay{position:fixed;inset:0;background:rgba(8,7,5,.72);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:600px;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;padding:17px 20px;border-bottom:1px solid var(--border-soft)}
.modal-head h3{font-family:var(--font-display);font-size:17px;font-weight:600}
.modal-head .spacer{flex:1}
.modal-body{padding:20px}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:15px 20px;border-top:1px solid var(--border-soft)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-bottom:5px}
.field label .req{color:var(--gold)}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px;font-size:13.5px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold-soft)}
.field textarea{resize:vertical;min-height:74px}
.field .err{color:var(--danger);font-size:11.5px;margin-top:4px;display:none}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.field.invalid .err{display:block}

.toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:var(--radius-sm);padding:11px 15px;font-size:13px;box-shadow:var(--shadow);min-width:220px;animation:slidein .18s ease-out}
.toast.ok{border-left-color:var(--mint)}
.toast.warn{border-left-color:var(--amber)}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- login gate ---------- */
.gate{position:fixed;inset:0;background:var(--bg);z-index:400;display:flex;
  align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:390px;text-align:left}
.gate-card .mark{font-family:var(--font-display);font-size:30px;font-weight:600;margin-bottom:4px}
.gate-card .mark .dot{color:var(--gold)}
.gate-card .tag{font-size:10.5px;letter-spacing:.22em;color:var(--text-faint);margin-bottom:30px}
.gate-card h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:6px}
.gate-card p.lede{font-size:13.5px;color:var(--text-dim);margin-bottom:20px;line-height:1.6}
.gate-card label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-faint);margin-bottom:6px}
.gate-card input{width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:11px 13px;font-size:14px;outline:none}
.gate-card input:focus{border-color:var(--gold-soft)}
.gate-card input.code{letter-spacing:.42em;font-size:20px;text-align:center;
  font-variant-numeric:tabular-nums;padding:13px}
.gate-card .btn{width:100%;justify-content:center;margin-top:14px;padding:11px}
.gate-msg{margin-top:14px;font-size:12.5px;line-height:1.6;display:none}
.gate-msg.show{display:block}
.gate-msg.err{color:var(--danger)}
.gate-msg.ok{color:var(--mint)}
.gate-msg code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:11.5px}
.gate-back{margin-top:16px;font-size:12.5px;color:var(--text-faint);cursor:pointer;display:inline-block}
.gate-back:hover{color:var(--gold)}
.gate-foot{margin-top:30px;font-size:11.5px;color:var(--text-faint);line-height:1.7}
.app{display:none}
.app.ready{display:flex}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="mark">Aflowgent<span class="dot">.</span></div>
    <div class="tag">DASHBOARD</div>

    <div id="gateRedirect">
      <h2>Checking access…</h2>
      <p class="lede">Taking you to the sign-in page.</p>
    </div>

    <div id="gateStep1" style="display:none">
      <h2>Sign in</h2>
      <p class="lede">Enter your Aflowgent address and we'll email you a sign-in code.</p>
      <label for="gateEmail">Email</label>
      <input id="gateEmail" type="email" autocomplete="username" placeholder="you@aflowgent.com" spellcheck="false">
      <button class="btn btn-primary" id="gateSend">Email me a code</button>
    </div>

    <div id="gateStep2" style="display:none">
      <h2>Check your inbox</h2>
      <p class="lede">We sent a code to <b id="gateSentTo"></b>. It expires in about an hour.</p>
      <label for="gateCode">Sign-in code</label>
      <input id="gateCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="00000000">
      <button class="btn btn-primary" id="gateVerify">Sign in</button>
      <span class="gate-back" id="gateBack">← Use a different address</span>
    </div>

    <div class="gate-msg" id="gateMsg"></div>
    <div class="gate-foot" id="gateFoot"></div>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Aflowgent<span class="dot">.</span></h1>
      <p>DASHBOARD</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span id="whoami"></span>
      <div style="margin-top:8px"><a class="gate-back" href="/" style="margin-top:0">← aflowgent.com</a></div>
      <div style="margin-top:4px"><span class="gate-back" onclick="signOut()">Sign out</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="search">
        <span class="mag">&#9906;</span>
        <input id="globalSearch" type="text" placeholder="Search everything…" autocomplete="off">
        <div id="searchResults" class="search-results" style="display:none"></div>
      </div>
      <div style="flex:1"></div>
      <button class="btn btn-sm" onclick="refreshData()">Refresh</button>
      <button class="btn btn-sm" onclick="exportData()">Export data</button>
      <button class="btn btn-sm" onclick="document.getElementById('importFile').click()">Import data</button>
      <input id="importFile" type="file" accept=".json,application/json" style="display:none">
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ===========================================================================
   CONFIG — Aflowgent's own pipeline and objects.
   =========================================================================== */
const CONFIG = {
  app:{ name:"Aflowgent", currency:"$", locale:"en-US" },

  /* Simpler than client builds, on purpose. */
  stages:[
    { key:"lead",     label:"Lead",          tone:"violet", rank:1 },
    { key:"proposal", label:"Proposal",      tone:"amber",  rank:2 },
    { key:"building", label:"Building",      tone:"gold",   rank:3 },
    { key:"active",   label:"Active client", tone:"mint",   rank:4 },
    { key:"dormant",  label:"Dormant",       tone:"dim",    rank:0 }
  ],

  lists:{
    projStatus:["In development","Live / delivered","Paused","Cancelled"],
    expenseCats:["Software & tools","Hosting & domains","Marketing","Hardware","Contractors","Travel","Other"],
    revenueTypes:["Monthly payment","Upfront build","One-time project","Other"],
    activityKinds:["Meeting","Call","Email","Proposal sent","Demo","Build milestone","Payment","Note"],
    contactPrefs:["Email","Phone","Text","Any"]
  },

  objects:{
    companies:{
      label:"Company", plural:"Companies", icon:"▣", titleField:"name",
      listColumns:["name","industry","stage","monthlyFee","status","nextStep"],

/* ---- camelCase in the app  <->  snake_case in Postgres ---- */
const KEY_TO_DB = {
  companies:{monthlyFee:"monthly_fee", clientSince:"client_since", nextStep:"next_step"},
  contacts:{companyId:"company_id"},
  projects:{companyId:"company_id", startDate:"start_date", dueDate:"due_date",
            upfrontPrice:"upfront_price", monthlyPrice:"monthly_price"},

  activities:{relCompanyId:"rel_company_id", relProjectId:"rel_project_id"}
};
const TABLES = ["companies","contacts","projects","expenses","revenue","activities"];
const NUMERIC = new Set(["monthly_fee","amount","upfront_price","monthly_price"]);
const DATEY   = new Set(["client_since","date","start_date","due_date"]);

function toDb(o,rec){
  const m=KEY_TO_DB[o]||{}, out={};
  Object.entries(rec).forEach(([k,v])=>{
    if(k==="id"||k==="recurring"||v===undefined) return;
    const dk=m[k]||k;
    /* Postgres rejects "" for numeric and date columns — send null instead */
    out[dk] = ((NUMERIC.has(dk)||DATEY.has(dk)) && (v===""||v===null)) ? null : v;
  });
  return out;
}
function fromDb(o,row){
  const m=KEY_TO_DB[o]||{}, inv={};
  Object.entries(m).forEach(([js,db])=>inv[db]=js);
  const out={};
  Object.entries(row).forEach(([k,v])=>{
    if(k==="created_at"||k==="updated_at") return;
    out[inv[k]||k] = (v===null ? "" : v);
  });
  return out;
}
function dbErr(e,what){
  console.error(e);
  toast("Couldn't "+what+" — "+(e.message||"connection problem"),"warn");
}

/* ===========================================================================
   STORE — an in-memory mirror of the database. Reads come from the mirror so
   every render stays synchronous; writes go to Postgres first and only update
   the mirror once the row comes back, so what you see is what was saved.
   =========================================================================== */
const store = {
  db: EMPTY(),
  async loadAll(){
    const res = await Promise.all(TABLES.map(t=>sb.from(t).select("*")));
    TABLES.forEach((t,i)=>{
      if(res[i].error) throw res[i].error;
      this.db[t] = res[i].data.map(r=>fromDb(t,r));
    });
  },
  all(o){ return this.db[o] ? this.db[o].slice() : []; },
  get(o,id){ return (this.db[o]||[]).find(r=>r.id===id) || null; },
  async create(o,rec){
    const {data,error} = await sb.from(o).insert(toDb(o,rec)).select().single();
    if(error){ dbErr(error,"save that"); return null; }
    const r = fromDb(o,data); this.db[o].unshift(r); return r;
  },
  async update(o,id,patch){
    const {data,error} = await sb.from(o).update(toDb(o,patch)).eq("id",id).select().single();
    if(error){ dbErr(error,"save that"); return null; }
    const r = fromDb(o,data);
    const i = this.db[o].findIndex(x=>x.id===id);
    if(i>=0) this.db[o][i]=r; else this.db[o].unshift(r);
    return r;
  },
  async remove(o,id){
    const {error} = await sb.from(o).delete().eq("id",id);
    if(error){ dbErr(error,"delete that"); return false; }
    this.db[o] = this.db[o].filter(x=>x.id!==id); return true;
  },
  activityFor(t,id){
    const key = t==="companies" ? "relCompanyId" : t==="projects" ? "relProjectId" : null;
    if(!key) return [];
    let acts=this.db.activities.filter(a=>a[key]===id);
    if(t==="companies"){
      const pids=this.db.projects.filter(p=>p.companyId===id).map(p=>p.id);
      acts=acts.concat(this.db.activities.filter(a=>pids.includes(a.relProjectId)&&a.relCompanyId!==id));
    }
    return acts.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  }
};

          const {error}=await sb.from(t).insert(toDb(t,copy));

      }

});

function fmtDate(d){ if(!d) return "";
  const dt=new Date(d+(String(d).length===10?"T12:00:00":"")); if(isNaN(dt)) return d;
  return dt.toLocaleDateString(CONFIG.app.locale,{month:"short",day:"numeric",year:"numeric"}); }
function fmtMoney(v){ if(v===""||v==null||isNaN(v)) return "";
  const n=Number(v);
  return (n<0?"-":"")+CONFIG.app.currency+Math.abs(n).toLocaleString(CONFIG.app.locale,{maximumFractionDigits:2}); }
function daysSince(d){ if(!d) return null;
  const dt=new Date(d+(String(d).length===10?"T12:00:00":"")); if(isNaN(dt)) return null;
  return Math.floor((today()-dt)/86400000); }
function relTime(d){ const n=daysSince(d);
  if(n===null) return "—"; if(n<0) return "in "+Math.abs(n)+"d"; if(n===0) return "today";
  if(n===1) return "yesterday"; if(n<30) return n+"d ago"; if(n<365) return Math.round(n/30)+"mo ago";
  return Math.round(n/365)+"y ago"; }

function cellValue(o,rec,key){
  const def=objDef(o), f=def.fields.find(f=>f.key===key);
  if(key==="relatedLabel"){
    const co=store.get("companies",rec.relCompanyId), pr=store.get("projects",rec.relProjectId);

  const v=rec[key];
  if(f&&f.stage) return stageBadge(v);
  if(key===def.titleField) return `<span class="strong">${esc(v||"(untitled)")}</span>`;
  if(f&&f.type==="relation"){
    const r=store.get(f.rel,v); return r?esc(titleOf(f.rel,r)):`<span class="dim">—</span>`;
  }
  if(f&&f.type==="money"){
    if(v===""||v==null) return `<span class="dim">—</span>`;
    const cls=o==="expenses"?"money-out":o==="revenue"?"money-in":"";
    return `<span class="num ${cls}">${fmtMoney(v)}</span>`;
  }
  if(f&&f.type==="date")  return `<span class="num dim">${v?fmtDate(v):"—"}</span>`;
  if(f&&f.type==="bool")  return v?`<span class="badge badge-mint"><i></i>Yes</span>`:`<span class="dim">No</span>`;
  return v?esc(v):`<span class="dim">—</span>`;
}

/* ============================ LIST ======================================== */
const DEFAULT_SORT={ companies:{sort:"stage",dir:-1},   // furthest along on top
                     expenses:{sort:"date",dir:-1}, revenue:{sort:"date",dir:-1},
                     activities:{sort:"date",dir:-1}, projects:{sort:"dueDate",dir:1} };
function viewList(o){
  const d=objDef(o);
  const st=listState[o]=listState[o]||{q:"",stage:"",industry:"",...(DEFAULT_SORT[o]||{sort:d.listColumns[0],dir:1})};
  let rows=store.all(o);
  if(st.q){ const q=st.q.toLowerCase(); rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)); }
  if(st.stage) rows=rows.filter(r=>r.stage===st.stage);
  if(st.industry) rows=rows.filter(r=>r.industry===st.industry);

  const sortVal=(r,k)=>{
    const f=d.fields.find(f=>f.key===k);
    if(f&&f.stage) return stageOf(r[k]).rank ?? 0;        // pipeline order, not A–Z
    if(f&&f.type==="relation") return titleOf(f.rel,store.get(f.rel,r[k]))||"";
    const v=r[k]; return typeof v==="number"?v:String(v==null?"":v).toLowerCase();
  };
  rows.sort((a,b)=>{
    const x=sortVal(a,st.sort), y=sortVal(b,st.sort);
    if(x>y) return st.dir; if(x<y) return -st.dir;
    const fa=Number(a.monthlyFee)||0, fb=Number(b.monthlyFee)||0;   // then by monthly revenue
    if(fa!==fb) return fb-fa;
    return String(titleOf(o,a)).localeCompare(String(titleOf(o,b))); // then alphabetically
  });

  const hasStage=d.fields.some(f=>f.stage);
  const cols=d.listColumns;
  const head=cols.map(c=>{
    const f=d.fields.find(f=>f.key===c);
    const label=c==="relatedLabel"?"Related to":(f?f.label:c);
    const arrow=st.sort===c?`<span class="arrow">${st.dir>0?"▲":"▼"}</span>`:"";
    return `<th data-sort="${esc(c)}">${esc(label)}${arrow}</th>`;
  }).join("");

  /* money tabs get running totals in the header + a footer total row */
  let totalsHtml="";
  if(o==="expenses"){
    const shown=sum(rows,"amount");
    totalsHtml=`<div class="grid tiles" style="margin-bottom:14px">
      <div class="tile accent-danger"><div class="k">Total · all time</div><div class="v">${fmtMoney(expensesAll())||"$0"}</div><div class="m">${store.all(o).length} expenses</div></div>
      <div class="tile accent-amber"><div class="k">This month</div><div class="v">${fmtMoney(expensesMonth())||"$0"}</div><div class="m">${esc(monthLabel())}</div></div>
      <div class="tile accent-violet"><div class="k">Renews monthly</div><div class="v">${fmtMoney(sum(store.all(o).filter(e=>e.renewal==="Monthly"),"amount"))||"$0"}</div></div>
      <div class="tile"><div class="k">Renews yearly</div><div class="v">${fmtMoney(sum(store.all(o).filter(e=>e.renewal==="Yearly"),"amount"))||"$0"}</div></div>
    </div>`;
  }
  if(o==="revenue"){
    const monthly=sum(store.all(o).filter(r=>r.type==="Monthly payment"),"amount");
    const upfront=sum(store.all(o).filter(r=>r.type==="Upfront build"),"amount");
    totalsHtml=`<div class="grid tiles" style="margin-bottom:14px">
      <div class="tile accent-mint"><div class="k">Total · all time</div><div class="v">${fmtMoney(revenueAll())||"$0"}</div><div class="m">${store.all(o).length} entries</div></div>
      <div class="tile accent-gold"><div class="k">This month</div><div class="v">${fmtMoney(revenueMonth())||"$0"}</div><div class="m">${esc(monthLabel())}</div></div>
      <div class="tile accent-violet"><div class="k">Monthly payments</div><div class="v">${fmtMoney(monthly)||"$0"}</div><div class="m">all recurring income logged</div></div>
      <div class="tile"><div class="k">Upfront builds</div><div class="v">${fmtMoney(upfront)||"$0"}</div><div class="m">one-time build fees</div></div>
    </div>`;
  }
  const showFoot=(o==="expenses"||o==="revenue")&&rows.length;
  const amountIdx=cols.indexOf("amount");

  return `
  <div class="page-head">
    <div><h2>${esc(d.plural)}</h2><div class="sub">${store.all(o).length} total</div></div>
    <div class="spacer"></div>
    <button class="btn btn-primary" onclick="openForm('${o}')">+ Add a new ${esc(d.label)}</button>
  </div>

  ${totalsHtml}

  <div class="filters">
    <input id="lq" type="text" placeholder="Filter ${esc(d.plural.toLowerCase())}…" value="${esc(st.q)}">
    ${hasStage?`<select id="lstage"><option value="">All stages</option>
      ${CONFIG.stages.map(s=>`<option value="${s.key}" ${st.stage===s.key?"selected":""}>${esc(s.label)}</option>`).join("")}
    </select>`:""}
    ${o==="companies"?`<select id="lindustry"><option value="">All industries</option>
      ${[...new Set(store.all("companies").map(c=>c.industry).filter(Boolean))].sort().map(v=>
        `<option value="${esc(v)}" ${st.industry===v?"selected":""}>${esc(v)}</option>`).join("")}
    </select>`:""}
    <div class="spacer"></div>
    <span class="result-count">${rows.length} shown</span>
  </div>

  ${rows.length?`
  <div class="table-wrap">
    <table><thead><tr>${head}</tr></thead><tbody>
      ${rows.map(r=>`<tr onclick="go('#/${o}/${r.id}')">
        ${cols.map(c=>`<td>${cellValue(o,r,c)}</td>`).join("")}
      </tr>`).join("")}
    </tbody>
    ${showFoot?`<tfoot><tr>
      ${cols.map((c,i)=> i===0?`<td>Total shown</td>`
        : i===amountIdx?`<td><span class="num ${o==="expenses"?"money-out":"money-in"}">${fmtMoney(sum(rows,"amount"))}</span></td>`
        : `<td></td>`).join("")}
    </tr></tfoot>`:""}
    </table>
  </div>`
  :`<div class="table-wrap"><div class="empty">
      <div class="e-ico">${d.icon||"·"}</div>
      <h4>No ${esc(d.plural.toLowerCase())} yet</h4>
      <p>${st.q||st.stage?"Try clearing the filters above.":`Add your first ${esc(d.label.toLowerCase())} — the dashboard updates the moment you do.`}</p>
      <button class="btn btn-primary" onclick="openForm('${o}')">+ Add a new ${esc(d.label)}</button>
    </div></div>`}`;
}

function bindListControls(){
  const q=$("#lq");
  if(q){ q.oninput=()=>{ listState[route.obj].q=q.value; const p=q.selectionStart;
    $("#view").innerHTML=viewList(route.obj); bindListControls();
    const n=$("#lq"); n.focus(); n.setSelectionRange(p,p); }; }
  const s=$("#lstage");
  if(s) s.onchange=()=>{ listState[route.obj].stage=s.value; $("#view").innerHTML=viewList(route.obj); bindListControls(); };
  const ind=$("#lindustry");
  if(ind) ind.onchange=()=>{ listState[route.obj].industry=ind.value; $("#view").innerHTML=viewList(route.obj); bindListControls(); };
  document.querySelectorAll("th[data-sort]").forEach(th=>{
    th.onclick=()=>{ const k=th.dataset.sort, st=listState[route.obj];
      if(st.sort===k) st.dir*=-1; else {st.sort=k;st.dir=1;}
      $("#view").innerHTML=viewList(route.obj); bindListControls(); };
  });
}

/* =========================== FORMS ======================================== */
function fieldHtml(o,f,val){
  const req=f.required?`<span class="req">*</span>`:"";
  let input="";
  if(f.stage){
    input=`<select data-k="${f.key}">${CONFIG.stages.map(s=>
      `<option value="${s.key}" ${val===s.key?"selected":""}>${esc(s.label)}</option>`).join("")}</select>`;
  } else if(f.type==="select"){
    input=`<select data-k="${f.key}"><option value="">—</option>${listOf(f).map(op=>
      `<option value="${esc(op)}" ${val===op?"selected":""}>${esc(op)}</option>`).join("")}</select>`;
  } else if(f.type==="relation"){
    const opts=store.all(f.rel);
    input=`<select data-k="${f.key}"><option value="">—</option>${opts.map(r=>
      `<option value="${r.id}" ${val===r.id?"selected":""}>${esc(titleOf(f.rel,r))}</option>`).join("")}</select>`;
  } else if(f.type==="datalist"){
    const vals=[...new Set(store.all(o).map(r=>r[f.key]).filter(Boolean))].sort();
    input=`<input data-k="${f.key}" list="dl_${f.key}" autocomplete="off" value="${esc(val||"")}">
      <datalist id="dl_${f.key}">${vals.map(v=>`<option value="${esc(v)}"></option>`).join("")}</datalist>`;
  } else if(f.type==="textarea"){ input=`<textarea data-k="${f.key}">${esc(val||"")}</textarea>`;
  } else if(f.type==="bool"){
    input=`<select data-k="${f.key}"><option value="">No</option><option value="1" ${val?"selected":""}>Yes</option></select>`;
  } else {
    const t=f.type==="date"?"date":f.type==="money"||f.type==="number"?"number":f.type==="email"?"email":"text";
    const step=f.type==="money"?' step="0.01" min="0"':"";
    input=`<input data-k="${f.key}" type="${t}"${step} value="${esc(val==null?"":val)}">`;
  }
  return `<div class="field ${f.full?"full":""}" data-field="${f.key}">
    <label>${esc(f.label)} ${req}</label>${input}
    <div class="err">Required</div></div>`;
}

async function saveForm(o,id){
  const d=objDef(o), patch={}; let ok=true;
  d.fields.forEach(f=>{
    const wrap=document.querySelector(`[data-field="${f.key}"]`);
    const el=wrap.querySelector("[data-k]");
    let v;
    if(f.type==="bool") v=!!el.value;
    else if(f.type==="money"||f.type==="number") v=el.value===""?"":Number(el.value);
    else v=el.value;
    if(f.required&&(v===""||v==null)){ wrap.classList.add("invalid"); ok=false; }
    else wrap.classList.remove("invalid");
    patch[f.key]=v;
  });
  if(!ok){ toast("Fill the required fields","warn"); return; }
  const btn=document.querySelector(".modal-foot .btn-primary");
  if(btn){ btn.disabled=true; btn.textContent="Saving…"; }
  if(id){
    const r=await store.update(o,id,patch);
    if(!r){ if(btn){btn.disabled=false;btn.textContent="Save changes";} return; }
    toast("Saved","ok"); closeModal(); render();
  } else {
    const r=await store.create(o,patch);
    if(!r){ if(btn){btn.disabled=false;btn.textContent="Add it";} return; }
    toast(objDef(o).label+" added","ok"); closeModal();
    if(o==="expenses"||o==="revenue"||o==="activities") render();
    else { go(`#/${o}/${r.id}`); render(); }
  }
}

/* Both the app and the database check this. The database one is the real gate. */
const isAllowed = e => ALLOWED.includes(String(e||"").trim().toLowerCase());

async function enterApp(email){
  sessionEmail=email;
  gate("whoami").innerHTML="Signed in as<br><span style='opacity:.75'>"+esc(email)+"</span>";
  /* A just-minted token is occasionally refused on the very first request —
     clock skew between the auth server and the API is enough to do it. That is
     transient, so retry once quietly before giving up: a half-second pause beats
     a dead-end error screen. And if it really does fail, show the database's own
     message rather than guessing at the allow-list, which sent us hunting
     through a table that was never the problem. */
  let loadErr = null;
  for(let attempt = 0; attempt < 2; attempt++){
    try{ await store.loadAll(); loadErr = null; break; }
    catch(e){
      loadErr = e;
      if(attempt === 0) await new Promise(r=>setTimeout(r, 1200));
    }
  }
  if(loadErr){
    gate("gateRedirect").style.display="none";
    gateMsg("Signed in as <b>"+esc(email)+"</b>, but the database refused the request."
           +"<br><span style='opacity:.75'>"+esc(loadErr.message || String(loadErr))+"</span>"
           +"<br><br><span class='gate-back' onclick='location.reload()'>Try again</span>"
           +" &nbsp;·&nbsp; if it keeps failing, check that this address is in "
           +"<code>allowed_emails</code>.","err");
    showGate(); return;
  }
  showApp(); render();
}

async function startApp(createClient){
  if(!CONFIGURED){
    gate("gateRedirect").style.display="none";
    gate("gateStep1").style.display="none";
    gateMsg("<b>Not connected yet.</b> Open this file and paste your Supabase project URL and "
           +"publishable key into <code>SUPABASE_URL</code> / <code>SUPABASE_KEY</code> near the "
           +"top of the script. Step-by-step instructions are in SETUP.md.","err");
    return;
  }
  sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  /* Sign-in lives on the homepage, so this page only ever checks the session it
     was handed. Anything else — no session, an expired one, or an address that
     isn't on the list — goes back to aflowgent.com with the login box open. The
     database would refuse them anyway; this just avoids a second login screen. */
  const {data:{session}} = await sb.auth.getSession();
  if(session && isAllowed(session.user.email)){
    await enterApp(session.user.email.toLowerCase());
  } else {
    if(session) { try{ await sb.auth.signOut(); }catch(e){} }
    window.location.replace("/?login=1");
    return;
  }

  gate("gateSend").onclick = async ()=>{
    const email=gate("gateEmail").value.trim().toLowerCase();
    if(!email){ gateMsg("Enter your email address.","err"); return; }
    if(!isAllowed(email)){
      gateMsg("That address doesn't have access. This CRM is limited to "
             +ALLOWED.join(" and ")+".","err"); return;
    }
    const b=gate("gateSend"); b.disabled=true; b.textContent="Sending…";
    /* shouldCreateUser:false — nobody can bring a new account into existence here */
    const {error} = await sb.auth.signInWithOtp({email, options:{shouldCreateUser:false}});
    b.disabled=false; b.textContent="Email me a code";
    if(error){
      gateMsg(/not found|signup/i.test(error.message)
        ? "No account for that address yet. Add it under Auth → Users in Supabase."
        : "Couldn't send the code — "+esc(error.message),"err");
      return;
    }
    gate("gateSentTo").textContent=email;
    gate("gateStep1").style.display="none";
    gate("gateStep2").style.display="";
    gateMsg("","" ); gate("gateMsg").className="gate-msg";
    gate("gateCode").focus();
  };

  gate("gateVerify").onclick = async ()=>{
    const email=gate("gateEmail").value.trim().toLowerCase();
    const token=gate("gateCode").value.trim();
    if(token.length<6){ gateMsg("Enter the code from the email.","err"); return; }
    const b=gate("gateVerify"); b.disabled=true; b.textContent="Checking…";
    const {data,error} = await sb.auth.verifyOtp({email, token, type:"email"});
    b.disabled=false; b.textContent="Sign in";
    if(error){ gateMsg("That code didn't work — "+esc(error.message),"err"); return; }
    if(!isAllowed(data.user.email)){ await sb.auth.signOut(); gateMsg("That address doesn't have access.","err"); return; }
    await enterApp(data.user.email.toLowerCase());
  };

  gate("gateBack").onclick = ()=>{
    gate("gateStep2").style.display="none"; gate("gateStep1").style.display="";
    gate("gateCode").value=""; gate("gateMsg").className="gate-msg";
  };
  gate("gateCode").addEventListener("keydown",e=>{ if(e.key==="Enter") gate("gateVerify").click(); });
  gate("gateEmail").addEventListener("keydown",e=>{ if(e.key==="Enter") gate("gateSend").click(); });
}
window.startApp = startApp;

/* If the Supabase library never arrives (offline, blocked CDN), say so rather
   than leaving a dead login button. */
setTimeout(()=>{ if(!sb && CONFIGURED && !sessionEmail)
  gateMsg("Still loading the sign-in library. If this doesn't clear, check your internet connection.","err");
}, 6000);

</script>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  window.startApp(createClient);
</script>
</body>
</html>
